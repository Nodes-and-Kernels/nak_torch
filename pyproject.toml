[project]
name = "nak-torch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Daniel Sharp", email = "dannys4@mit.edu" },
    { name = "Ayoub Belhadji", email = "abelhadj@mit.edu" }
]
requires-python = ">=3.12"
dependencies = [
    "jaxtyping>=0.3.5",
    "numpy>=2.4.1",
    "torch>=2.10",
    "tqdm>=4.67.1",
]

[project.scripts]
nak-torch = "nak_torch:main"

[project.optional-dependencies]
examples = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.8",
    "posteriordb",
    "pyro-ppl>=1.9.1",
    "pystan",
    "scipy>=1.17.1",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pandas>=3.0.2",
    "pyro-ppl>=1.9.1",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
    "scipy>=1.17.1",
]

[tool.pytest.ini_options]
# minversion = "6.0"
# addopts = "-ra -q"
addopts = ["-p", "no:warnings"]
testpaths = [
    "tests",
]

[tool.ruff.lint]
# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
ignore = ["F722"]

[tool.uv.sources]
pystan = { git = "https://github.com/dannys4/pystan", branch = "change_function_interface" }
posteriordb = { git = "https://github.com/stan-dev/posteriordb-python" }
