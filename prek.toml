exclude = { glob = "^src" }

[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.15.0" # Ruff version.
hooks = [
  # Run the linter.
  { id = "ruff-check", args = ["--fix", "src"], types_or = ["python", "pyi"] },

  # Run the formatter.
  { id = "ruff-format", args = ["src"], types_or = ["python", "pyi"] },
]